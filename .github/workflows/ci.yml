name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("survival", "readr", "dplyr", "stringr", "glmnet", "ranger", "renv"))'
      - name: Parse every script (no ADNI data in CI)
        run: Rscript -e 'for (f in list.files("R", "[.]R$", full.names = TRUE)) { parse(f); cat("parsed", f, "\n") }'
      - name: Record package versions (renv.lock)
        run: |
          Rscript -e 'renv::snapshot(project = ".", lockfile = "renv.lock", packages = c("survival", "readr", "dplyr", "stringr", "glmnet", "ranger"), prompt = FALSE)'
      - uses: actions/upload-artifact@v4
        with:
          name: renv-lock
          path: renv.lock
