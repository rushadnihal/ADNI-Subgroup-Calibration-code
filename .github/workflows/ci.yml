name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
          use-public-rspm: true
      - name: Install pinned R packages (renv.lock)
        run: Rscript -e 'install.packages("renv"); renv::restore(lockfile = "renv.lock", library = .libPaths()[1], prompt = FALSE)'
      - name: Parse every script (no ADNI data in CI)
        run: Rscript -e 'for (f in list.files("R", "[.]R$", full.names = TRUE)) { parse(f); cat("parsed", f, "\n") }'
